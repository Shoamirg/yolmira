[package]
name = "yolmira"
version = "0.1.0"
description = "Yolmira binaries: the `yolmirad` daemon and the `yolmira` CLI. One package so integration tests can launch both."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "yolmirad"
path = "src/bin/yolmirad.rs"

[[bin]]
name = "yolmira"
path = "src/bin/yolmira.rs"

[dependencies]
yolmira-core.workspace = true
yolmira-store.workspace = true
yolmira-ipc.workspace = true
yolmira-exec.workspace = true
base64.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
toml.workspace = true
windows-sys.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true
portable-pty.workspace = true
