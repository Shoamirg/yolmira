[package]
name = "amiri-app"
version = "0.1.0"
description = "AMIRI desktop UI: a Tauri 2 client of the amirid daemon. It never owns the daemon."
edition = "2021"
rust-version = "1.94"
publish = false

# Its own workspace, so `cargo test --workspace` at the root doesn't need the built
# frontend. It shares the root `target/` (see .cargo/config.toml), so amiri-app.exe
# sits next to amirid.exe, which it starts through ensure_daemon().
[workspace]

[[bin]]
name = "amiri-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
tauri-codegen = "=2.6.3"

[dependencies]
amiri-core = { path = "../../crates/amiri-core" }
amiri-ipc = { path = "../../crates/amiri-ipc" }
tauri = { version = "=2.11.6", features = [] }
# tauri 2.11.6 asks for its sub-crates with caret requirements, so a fresh resolve
# picks the 2.12 ones it doesn't compile with. Hold them at the 2.11.6 release set.
tauri-runtime = "=2.11.3"
tauri-runtime-wry = "=2.11.4"
tauri-macros = "=2.6.3"
tauri-utils = "=2.9.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
