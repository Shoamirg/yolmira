# Windows CI on a GitHub-hosted runner (decisions.md, "CI"): the en-US locale pass.
# ru-RU is covered by local runs. No self-hosted runners.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (pinned)
        shell: pwsh
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
          rustup default 1.94.1
          rustc --version

      - name: Environment facts
        shell: pwsh
        run: |
          Get-Culture | Select-Object Name
          [Console]::OutputEncoding.CodePage
          whoami /groups | Select-String 'S-1-16-'
          [Environment]::OSVersion.Version.ToString()
          powershell -NoProfile -Command "`$PSVersionTable.PSVersion.ToString(); Get-Module -ListAvailable PSReadLine | ForEach-Object { `$_.Version.ToString() + ' ' + `$_.ModuleBase }"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The desktop UI (app/). Its E2E tests run locally only: msedgedriver must match
      # the machine's WebView2 exactly (phase1-plan §5), which a hosted image doesn't pin.
      - name: Node (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: UI frontend (install without scripts, unit tests, typecheck, build)
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build

      - name: UI app crate (format, clippy, unit tests)
        working-directory: app/src-tauri
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      # A fresh image builds Windows PowerShell's module-analysis cache on the first
      # command, which can take longer than a test step; do it once up front.
      - name: Warm up Windows PowerShell
        run: powershell -NoProfile -Command "Get-Command Write-Output, Write-Host | Out-Null; Write-Output ready"

      # The runner's own job object forbids breakaway, so the detach tests can't run
      # here; the flag makes them report "NOT RUN ON CI" (they run locally).
      - name: Tests (outside cargo's job object)
        shell: pwsh
        env:
          AMIRI_CI_NO_BREAKAWAY: "1"
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test.ps1
